[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lyric-agent"
version = "0.1.0"
description = "AI-powered lyrics annotation player for Taylor Swift songs"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40.0",
    "openai>=1.0",
]
ui = [
    "gradio>=4.0",
]
# 新前端（React SPA）的 FastAPI 薄 API 层
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
embeddings = [
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]
# 韵脚高亮 / 词云中文分词 / AI 电台 TTS / 听歌识曲
features = [
    "pypinyin>=0.50",
    "pronouncing>=0.2",
    "jieba>=0.42",
    "edge-tts>=6.1",
    "scipy>=1.10",
    "pydub>=0.25",
    "Pillow>=10.0",
]
# MCP 服务器（stdio），接入 Claude Code / Claude Desktop
mcp = [
    "mcp>=2.0",
]
all = [
    "lyric-agent[llm,ui,web,embeddings,features,mcp]",
]
dev = [
    "lyric-agent[all]",
    "pytest>=7.0",
    "pyflakes>=3.0",
    "httpx>=0.27",        # scripts/self_test.py
    "playwright>=1.40",   # scripts/ui_probe.py（还需 playwright install chromium）
]

[project.scripts]
lyric-agent = "lyric_agent.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
