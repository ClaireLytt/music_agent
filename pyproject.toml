[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lyric-agent"
version = "0.1.0"
description = "AI-powered lyrics annotation player for Taylor Swift songs"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40.0",
    "openai>=1.0",
]
ui = [
    "gradio>=4.0",
]
embeddings = [
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]
all = [
    "lyric-agent[llm,ui,embeddings]",
]
dev = [
    "lyric-agent[all]",
    "pytest>=7.0",
]

[project.scripts]
lyric-agent = "lyric_agent.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
